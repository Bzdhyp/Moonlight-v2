plugins {
    id "dev.kikugie.stonecutter"
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.2"
}

stonecutter.active "26.3-fabric"

stonecutter.parameters { node ->
    def (mcVersion, loader) = node.current.project.split("-", 2)

    node.getProperties().tags(mcVersion, loader)
    node.constants.match(loader, "fabric", "neoforge")
    node.swaps.put("mod_version", node.project.provider { "\"${node.project.property("mod.version")}\";".toString() })
}

tasks.register("buildAllJars") {
    group = "application"
    description = "Builds the Fabric and NeoForge jars and collects them into build/libs/{mod version}/"
    dependsOn(subprojects.collect { it.path + ":buildAndCollect" })
}

def clientTasks = subprojects.collect { node ->
    def name = node.name + "-client"
    tasks.register(name) {
        group = "application"
        description = "Starts the " + node.name + " client (" + node.path + ":runClient)"
        dependsOn(node.path + ":runClient")
    }
    name
}

def launchedFromRoot = gradle.startParameter.currentDir.canonicalFile == rootDir.canonicalFile
def multiNodeRuns = gradle.startParameter.taskNames.findAll { it in ["runClient", "runServer"] }
if (launchedFromRoot && multiNodeRuns) {
    throw new GradleException("在根项目运行 ${multiNodeRuns.join(", ")} 会把所有节点（Fabric 和 NeoForge）依次全部启动。" +
            "启动客户端请用 Moonlight → Tasks → application 里的 ${clientTasks.join(" / ")}，" +
            "或者子项目下的 :<节点>:${multiNodeRuns[0]}（例如 :26.3-fabric:${multiNodeRuns[0]}）。")
}

def ideaRuns = idea.project.settings.runConfigurations

subprojects.each { node ->
    ["client", "server"].each { side ->
        ideaRuns.create(node.name + "-" + side, org.jetbrains.gradle.ext.Gradle) { config ->
            config.taskNames = [node.path + ":run" + side.capitalize()]
            config.projectPath = rootDir.absolutePath
        }
    }
}

ideaRuns.create("buildAllJars", org.jetbrains.gradle.ext.Gradle) { config ->
    config.taskNames = ["buildAllJars"]
    config.projectPath = rootDir.absolutePath
}
