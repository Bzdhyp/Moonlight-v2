modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0-only"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "GzSakura1338"
description = "Moonlight client for Minecraft 26.3."

[[mixins]]
