plugins {
    id "net.fabricmc.fabric-loom" version "1.19.3"
}

def javaVersion = 25
def modId = property("mod.id").toString()
def modVersion = property("mod.version").toString()
def fabricLoader = property("deps.fabric_loader").toString()
def imguiVersion = property("deps.imgui").toString()

version = "${modVersion}+${sc.current.version}".toString()
base.archivesName = modId + "-fabric"

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "DevAuth"
                url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
            }
        }
        filter { includeGroup("me.djtheredstoner") }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"
    implementation "net.fabricmc:fabric-loader:${fabricLoader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property("deps.fabric_api")}"
    runtimeOnly "me.djtheredstoner:DevAuth-fabric:${property("deps.devauth")}"

    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    include "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation("io.github.spair:imgui-java-lwjgl3:${imguiVersion}") { exclude group: "org.lwjgl" }
    include("io.github.spair:imgui-java-lwjgl3:${imguiVersion}") { exclude group: "org.lwjgl" }
    ["windows", "linux", "macos"].each { os ->
        runtimeOnly "io.github.spair:imgui-java-natives-${os}:${imguiVersion}"
        include "io.github.spair:imgui-java-natives-${os}:${imguiVersion}"
    }
}

loom {
    fabricModJsonPath = rootProject.file("src/main/resources/fabric.mod.json")
    accessWidenerPath = rootProject.file("src/main/resources/moonlight.ct")

    decompilerOptions.named("vineflower") {
        options.put("mark-corresponding-synthetics", "1")
    }

    runConfigs.configureEach {
        ideConfigGenerated(false)
        runDir("../../run")
        vmArg("-Dmixin.debug.export=true")
    }

    runConfigs.matching { it.name == "client" }.configureEach {
        vmArg("-Ddevauth.enabled=true")
        vmArg("-Ddevauth.account=main")
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

sourceSets {
    preview {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

tasks.register("previewUi", JavaExec) {
    group = "application"
    description = "Opens the ClickGUI and HUD in a standalone ImGui window without starting Minecraft"
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = "wtf.moonlight.ui.imgui.Preview"
    workingDir = rootProject.file("run")
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    systemProperty("java.awt.headless", "true")
    systemProperty("org.apache.logging.log4j.level", "INFO")
    systemProperty("moonlight.assets", new File(gradle.gradleUserHomeDir, "caches/fabric-loom/assets").absolutePath)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

def resourceProps = [
        id       : modId,
        name     : property("mod.name").toString(),
        version  : modVersion,
        minecraft: property("mod.mc_compat").toString(),
        loader   : (fabricLoader =~ /\d+\.\d+/)[0].toString(),
]
def mixinJava = "JAVA_" + javaVersion

processResources {
    inputs.properties(resourceProps)

    filesMatching("fabric.mod.json") { expand(resourceProps) }
    filesMatching("*.mixins.json") { expand(java: mixinJava) }

    exclude("META-INF/neoforge.mods.toml")
}

tasks.register("buildAndCollect", Copy) {
    group = "build"
    description = "Builds mod jars and copies results to `build/libs/{mod version}/`"

    inputs.property("version", modVersion)
    from(tasks.named("jar").flatMap { it.archiveFile }, tasks.named("sourcesJar").flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir("libs/" + modVersion))
}
